<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/logo-darkMode.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="شفاء — منصة الرعاية الصحية الرقمية" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    
    <title>شفاء | Shefaa</title>
    <script>
      try {
        var t = localStorage.getItem('shefaa_theme'), l = localStorage.getItem('shefaa_lang');
        var el = document.documentElement;
        if (t === 'dark') el.setAttribute('data-theme', 'dark');
        if (l === 'en') { el.setAttribute('lang', 'en'); el.setAttribute('dir', 'ltr'); }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
